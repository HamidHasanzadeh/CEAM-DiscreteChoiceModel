[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceam-discretechoice"
version = "0.1.0"
description = "Cross-Effect Adaptive Model and SwissMetro experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
  "openpyxl>=3.1,<4",
  "scipy>=1.11,<2",
  "cma>=3.3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["ceam*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
