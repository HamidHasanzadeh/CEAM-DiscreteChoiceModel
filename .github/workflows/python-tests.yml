name: Python tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        run: python -m pytest
